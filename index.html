<style>
  :root {
    --sp-primary: #2d6cdf;
    --sp-secondary: #00c2a8;
    --sp-accent: #111827;
    --sp-bg: #f6f7fb;
    --sp-surface: #ffffff;
    --sp-text: #111827;
    --sp-muted: #667085;
    --sp-border: #e5e7eb;
    --sp-radius: 24px;
    --sp-font: Arial, Helvetica, sans-serif;
    --sp-font-size: 16px;
    --sp-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
    --sp-sidebar-width: 330px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: var(--sp-font);
    font-size: var(--sp-font-size);
    color: var(--sp-text);
    background: transparent;
  }

  .sp-widget {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    color: var(--sp-text);
  }

  .sp-card {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border);
    border-radius: var(--sp-radius);
    box-shadow: var(--sp-shadow);
    overflow: hidden;
  }

  .sp-screen { display: none; }
  .sp-screen.is-active { display: block; }

  .sp-loading, .sp-error {
    background: var(--sp-surface);
    border: 1px solid var(--sp-border);
    border-radius: var(--sp-radius);
    padding: 42px 28px;
    text-align: center;
    box-shadow: var(--sp-shadow);
  }

  .sp-loading__spinner {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    border: 3px solid rgba(0,0,0,0.08);
    border-top-color: var(--sp-primary);
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .sp-launch {
    display: grid;
    grid-template-columns: 1fr;
  }

  .sp-launch__top {
    padding: 32px 24px 22px;
    text-align: center;
    border-bottom: 1px solid var(--sp-border);
    background: linear-gradient(180deg, rgba(0,0,0,0.01), transparent);
  }

  .sp-avatar {
    width: 92px;
    height: 92px;
    border-radius: 18px;
    overflow: hidden;
    margin: 0 auto 14px;
    background: #eef2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--sp-border);
  }

  .sp-avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .sp-brand-name {
    margin: 0;
    font-size: 34px;
    line-height: 1.08;
    font-weight: 800;
    color: var(--sp-accent);
    letter-spacing: -0.02em;
  }

  .sp-kicker {
    margin: 0 0 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--sp-muted);
    font-weight: 700;
  }

  .sp-launch__meeting {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 20px 22px;
  }

  .sp-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--sp-primary);
    display: inline-block;
    margin-right: 10px;
    flex: 0 0 auto;
  }

  .sp-title-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    font-weight: 800;
    font-size: 17px;
    line-height: 1.4;
  }

  .sp-description {
    margin: 0 0 10px;
    color: var(--sp-muted);
    line-height: 1.7;
  }

  .sp-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 18px;
    color: var(--sp-text);
    font-size: 14px;
  }

  .sp-meta__item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .sp-meta__item svg { width: 16px; height: 16px; color: var(--sp-muted); }

  .sp-btn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    background: var(--sp-primary);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    padding: 15px 22px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--sp-primary) 18%, transparent);
  }

  .sp-btn:hover { transform: translateY(-1px); }
  .sp-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .sp-btn--ghost {
    background: transparent;
    color: var(--sp-primary);
    border: 1.5px solid color-mix(in srgb, var(--sp-primary) 40%, var(--sp-border));
    box-shadow: none;
  }

  .sp-flow {
    display: grid;
    grid-template-columns: minmax(260px, var(--sp-sidebar-width)) 1fr;
    min-height: 720px;
  }

  .sp-sidebar {
    border-right: 1px solid var(--sp-border);
    padding: 28px 22px;
  }

  .sp-main {
    padding: 28px 22px;
    min-width: 0;
  }

  .sp-back {
    appearance: none;
    border: 1px solid var(--sp-border);
    background: #fff;
    color: var(--sp-text);
    width: 42px;
    height: 42px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .sp-sidebar .sp-avatar {
    width: 82px;
    height: 82px;
    margin: 0 0 14px;
  }

  .sp-sidebar__name {
    margin: 0 0 10px;
    font-size: 17px;
    font-weight: 600;
    color: var(--sp-text);
  }

  .sp-sidebar__title {
    margin: 0 0 18px;
    font-size: 28px;
    line-height: 1.2;
    font-weight: 800;
    color: var(--sp-accent);
  }

  .sp-sidebar__desc {
    margin: 18px 0 0;
    color: var(--sp-text);
    line-height: 1.7;
  }

  .sp-step-title {
    margin: 0 0 22px;
    font-size: 19px;
    line-height: 1.3;
    font-weight: 800;
    color: var(--sp-accent);
  }

  /* AQUI ESTÁ O AJUSTE PRINCIPAL */
  .sp-screen[data-screen="schedule"] .sp-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 24px;
    align-items: start;
  }

  .sp-calendar {
    max-width: 100%;
  }

  .sp-calendar__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .sp-month-title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    color: var(--sp-accent);
  }

  .sp-icon-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--sp-primary);
    width: 34px;
    height: 34px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .sp-icon-btn:hover { background: rgba(0,0,0,0.04); }

  .sp-weekdays,
  .sp-days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
  }

  .sp-weekday {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--sp-accent);
    padding-bottom: 6px;
    text-transform: uppercase;
  }

  .sp-day {
    height: 46px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--sp-text);
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: all .18s ease;
  }

  .sp-day:disabled {
    cursor: default;
    color: #a0a8b5;
    opacity: .6;
  }

  .sp-day.is-selectable {
    background: #e9edf2;
    color: var(--sp-accent);
  }

  .sp-day.is-selected {
    background: var(--sp-primary);
    color: #fff;
    box-shadow: inset 0 -3px 0 rgba(255,255,255,0.18);
  }

  .sp-day.is-today {
    border-color: color-mix(in srgb, var(--sp-primary) 35%, var(--sp-border));
  }

  .sp-timezone {
    margin-top: 26px;
    max-width: 100%;
  }

  .sp-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--sp-accent);
  }

  .sp-select,
  .sp-input,
  .sp-textarea {
    width: 100%;
    border: 1px solid var(--sp-border);
    background: #fff;
    color: var(--sp-text);
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    min-height: 52px;
    outline: none;
  }

  .sp-select:focus,
  .sp-input:focus,
  .sp-textarea:focus {
    border-color: color-mix(in srgb, var(--sp-primary) 55%, var(--sp-border));
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--sp-primary) 12%, transparent);
  }

  /* horários ficam na coluna da direita */
  .sp-times-layout {
    display: block;
  }

  .sp-times-list {
    max-height: 520px;
    overflow: auto;
    padding-right: 6px;
    display: grid;
    gap: 12px;
  }

  .sp-times-list::-webkit-scrollbar {
    width: 8px;
  }

  .sp-times-list::-webkit-scrollbar-thumb {
    background: #d7dce3;
    border-radius: 999px;
  }

  .sp-times-list::-webkit-scrollbar-track {
    background: transparent;
  }

  .sp-time-slot {
    border: 1px solid var(--sp-border);
    background: #fff;
    color: var(--sp-accent);
    border-radius: 12px;
    min-height: 52px;
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    transition: all .18s ease;
  }

  .sp-time-slot:hover { border-color: var(--sp-primary); }
  .sp-time-slot.is-selected {
    border-color: var(--sp-primary);
    background: color-mix(in srgb, var(--sp-primary) 7%, #fff);
    color: var(--sp-primary);
  }

  .sp-time-slot__next {
    display: none;
    border-radius: 10px;
    background: var(--sp-primary);
    color: #fff;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
  }

  .sp-time-slot.is-selected .sp-time-slot__next { display: inline-flex; }

  .sp-side-date {
    position: static;
    border-left: 0;
    padding-left: 0;
    margin-bottom: 14px;
  }

  .sp-side-date__label {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 700;
    color: var(--sp-accent);
  }

  .sp-form {
    max-width: 620px;
    display: grid;
    gap: 14px;
  }

  .sp-form__row { display: grid; gap: 8px; }
  .sp-textarea { min-height: 100px; resize: vertical; }
  .sp-actions { display: flex; justify-content: flex-end; padding-top: 8px; }

  .sp-summary {
    display: grid;
    gap: 10px;
    margin-top: 14px;
    font-size: 15px;
  }

  .sp-summary__item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--sp-text);
    line-height: 1.6;
  }

  .sp-summary__item svg { width: 18px; height: 18px; color: var(--sp-muted); }

  .sp-success {
    padding: 36px 28px;
    text-align: center;
    max-width: 720px;
    margin: 0 auto;
  }

  .sp-success__icon {
    width: 74px;
    height: 74px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--sp-primary) 12%, #fff);
    color: var(--sp-primary);
    margin-bottom: 18px;
  }

  .sp-success__title {
    margin: 0 0 10px;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
    color: var(--sp-accent);
  }

  .sp-success__text {
    margin: 0 auto 18px;
    max-width: 620px;
    color: var(--sp-muted);
    line-height: 1.8;
  }

  .sp-success__box {
    text-align: left;
    background: #f8fafc;
    border: 1px solid var(--sp-border);
    border-radius: 18px;
    padding: 18px;
    max-width: 520px;
    margin: 0 auto 22px;
  }

  .sp-empty {
    border: 1px dashed var(--sp-border);
    border-radius: 14px;
    padding: 18px;
    color: var(--sp-muted);
    line-height: 1.7;
    background: #fafbfc;
  }

  .sp-error__actions,
  .sp-success__actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
  }

  @media (max-width: 900px) {
    .sp-flow {
      grid-template-columns: 1fr;
      min-height: auto;
    }

    .sp-sidebar {
      border-right: 0;
      border-bottom: 1px solid var(--sp-border);
    }

    .sp-screen[data-screen="schedule"] .sp-main {
      grid-template-columns: 1fr;
    }

    .sp-times-layout {
      display: block;
    }

    .sp-side-date {
      margin-bottom: 12px;
    }
  }

  @media (max-width: 640px) {
    .sp-brand-name { font-size: 26px; }

    .sp-launch__meeting {
      grid-template-columns: 1fr;
      justify-items: stretch;
    }

    .sp-btn { width: 100%; }
    .sp-sidebar__title { font-size: 24px; }
    .sp-main, .sp-sidebar { padding: 20px 16px; }
    .sp-weekdays, .sp-days { gap: 8px; }
    .sp-day { height: 42px; font-size: 16px; }
    .sp-step-title { font-size: 18px; }

    .sp-time-slot {
      grid-template-columns: 1fr;
    }
  }
</style>
